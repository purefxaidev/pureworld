name = "pureworld-npc"
main = "src/index.js"
compatibility_date = "2025-11-01"

[vars]
# Comma-separated list of origins allowed to request tokens. Use your Pages origin(s).
ALLOWED_ORIGINS = "https://purefxaidev.github.io,http://localhost:8080,http://127.0.0.1:8080,https://localhost,capacitor://localhost"
LIVE_MODEL = "gemini-3.8-live"
SESSION_MINUTES = "15"
RATE_LIMIT_PER_10MIN = "20"
# GEMINI_API_KEY is a SECRET: set it with `npx wrangler secret put GEMINI_API_KEY` (never commit it).
